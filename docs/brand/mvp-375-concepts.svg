  <text x="64" y="881" fill="#596174" font-family="Pretendard, Arial, sans-serif" font-size="17">화면 구조 예시 · 실제 제품 화면이나 분석 결과가 아닙니다. AI 생성 결과 및 금액 수치는 의도적으로 표시하지 않았습니다.</text>

