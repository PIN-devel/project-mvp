name: Analysis Hotfix Verification

on:
  push:
    branches: [hotfix/analysis-token-correction]

permissions:
  contents: read

jobs:
  analysis-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle
          cache-dependency-path: apps/backend-repo/*.gradle*
      - name: Analysis regression tests
        working-directory: apps/backend-repo
        run: ./gradlew test --tests cop.kbds.agilemvp.analysis.AnalysisContractTest --tests cop.kbds.agilemvp.analysis.client.BedrockAnalysisInterpreterTest
